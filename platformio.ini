; platformio.ini — BoilerControl_ESP32
; V10.1 — базовая конфигурация для переноса проекта в VS Code + PlatformIO
; Положи исходники в папку src/ (например, src/BoilerControl_ESP32.ino и .cpp/.h)

[platformio]
default_envs = esp32dev-release

; =============================
; Отладочная сборка
; =============================
[env:esp32dev-debug]
platform = espressif32
board = esp32dev            ; DOIT ESP32 DEVKIT V1 (WROOM-32)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_type = debug
monitor_filters = esp32_exception_decoder, time
; Если прошивка не влезает — можно включить крупный раздел приложения:
; board_build.partitions = huge_app.csv
; ФС (если понадобятся файлы): LittleFS
; board_build.filesystem = littlefs

lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
  adafruit/MAX6675 library @ ^1.1.0

; Доп. флаги (по желанию):
; build_flags = -DCORE_DEBUG_LEVEL=1

; =============================
; Релизная сборка (по умолчанию)
; =============================
[env:esp32dev-release]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_type = release
monitor_filters = esp32_exception_decoder, time

lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
  adafruit/MAX6675 library @ ^1.1.0

; Опционально зафиксировать версию Arduino core 3.x (как в Arduino IDE 3.3.x):
; platform_packages =
;   framework-arduinoespressif32 @ ~3.30000.0
;   toolchain-xtensa-esp32 @ ~11.2.0
; Примечание: строки выше используй только если нужна строгая фиксация версий.

; Порты можно указать явно (иначе авто):
; upload_port = COM4
; monitor_port = COM4
